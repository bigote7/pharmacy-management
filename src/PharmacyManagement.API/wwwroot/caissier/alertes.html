<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alertes - Caissier</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/caissier/caissier.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-gradient-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="bi bi-cash-register"></i> Point de Vente
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="dashboard.html">
                    <i class="bi bi-speedometer2"></i> Dashboard
                </a>
                <a class="nav-link" href="vente.html">
                    <i class="bi bi-cart-plus"></i> Nouvelle Vente
                </a>
                <a class="nav-link" href="#" onclick="logout()">
                    <i class="bi bi-box-arrow-right"></i> Déconnexion
                </a>
            </div>
        </div>
    </nav>

    <div class="container-fluid" style="padding: 20px 15px;">
        <div class="row g-3">
            <div class="col-md-2 sidebar">
                <div class="list-group">
                    <a href="dashboard.html" class="list-group-item list-group-item-action">
                        <i class="bi bi-speedometer2"></i> Dashboard
                    </a>
                    <a href="vente.html" class="list-group-item list-group-item-action">
                        <i class="bi bi-cart-plus"></i> Nouvelle Vente
                    </a>
                    <a href="historique.html" class="list-group-item list-group-item-action">
                        <i class="bi bi-clock-history"></i> Historique
                    </a>
                    <a href="clients.html" class="list-group-item list-group-item-action">
                        <i class="bi bi-people"></i> Clients
                    </a>
                    <a href="alertes.html" class="list-group-item list-group-item-action active">
                        <i class="bi bi-exclamation-triangle"></i> Alertes
                    </a>
                </div>
            </div>

            <div class="col-md-10">
                <h2 class="mb-4"><i class="bi bi-exclamation-triangle"></i> Alertes</h2>

                <!-- Stock Faible -->
                <div class="card mb-4">
                    <div class="card-header bg-gradient-danger text-white">
                        <h5 class="mb-0"><i class="bi bi-exclamation-triangle-fill"></i> Stock Faible</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Médicament</th>
                                        <th>Catégorie</th>
                                        <th>Stock Disponible</th>
                                        <th>Stock Minimum</th>
                                    </tr>
                                </thead>
                                <tbody id="alertes-stock">
                                    <tr><td colspan="4" class="text-center">Chargement...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Expirations -->
                <div class="card">
                    <div class="card-header bg-gradient-warning text-dark">
                        <h5 class="mb-0"><i class="bi bi-calendar-x"></i> Expirations Proches (30 jours)</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Médicament</th>
                                        <th>Numéro de Lot</th>
                                        <th>Quantité</th>
                                        <th>Date d'Expiration</th>
                                    </tr>
                                </thead>
                                <tbody id="alertes-expiration">
                                    <tr><td colspan="4" class="text-center">Chargement...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/caissier/caissier.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!checkAuth()) return;
            loadAlertes();
        });

        async function loadAlertes() {
            try {
                // Stock faible
                const responseStock = await fetch(`${API_BASE}/alertes/stock-faible`, {
                    headers: getAuthHeaders()
                });
                if (responseStock.ok) {
                    const alertes = await responseStock.json();
                    const html = alertes.map(a => `
                        <tr>
                            <td><strong>${a.nom}</strong></td>
                            <td>${a.categorie}</td>
                            <td><span class="badge bg-danger">${a.stockDisponible}</span></td>
                            <td>${a.stockMinimum}</td>
                        </tr>
                    `).join('') || '<tr><td colspan="4" class="text-center">Aucune alerte</td></tr>';
                    document.getElementById('alertes-stock').innerHTML = html;
                }

                // Expirations
                const responseExp = await fetch(`${API_BASE}/alertes/expiration`, {
                    headers: getAuthHeaders()
                });
                if (responseExp.ok) {
                    const stocks = await responseExp.json();
                    const html = stocks.map(s => `
                        <tr>
                            <td><strong>${s.medicamentNom}</strong></td>
                            <td>${s.numeroLot}</td>
                            <td>${s.quantite}</td>
                            <td><span class="badge bg-warning">${new Date(s.dateExpiration).toLocaleDateString('fr-FR')}</span></td>
                        </tr>
                    `).join('') || '<tr><td colspan="4" class="text-center">Aucune expiration proche</td></tr>';
                    document.getElementById('alertes-expiration').innerHTML = html;
                }
            } catch (error) {
                console.error(error);
            }
        }
    </script>
</body>
</html>
