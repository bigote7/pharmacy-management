<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Gestion de Pharmacie</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        .login-box h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
        }
        .login-form .form-group {
            margin-bottom: 20px;
        }
        .login-form input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }
        .login-form input:focus {
            outline: none;
            border-color: #667eea;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>🏥 Connexion</h1>
            <form class="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Nom d'utilisateur ou Email</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="login-btn">Se connecter</button>
                <div id="login-error" class="error" style="display: none; margin-top: 15px;"></div>
            </form>
        </div>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('login-error');
            errorDiv.style.display = 'none';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Stocker le token
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    localStorage.setItem('refreshToken', data.refreshToken);
                    
                    // Rediriger vers l'application
                    window.location.href = '/';
                } else {
                    errorDiv.textContent = data.error || 'Erreur de connexion';
                    errorDiv.style.display = 'block';
                    
                    // Si l'erreur indique que le compte n'existe pas, proposer de le créer
                    if (data.error && data.error.includes('incorrect')) {
                        const createBtn = document.createElement('button');
                        createBtn.textContent = 'Créer le compte admin';
                        createBtn.className = 'btn btn-primary';
                        createBtn.style.marginTop = '10px';
                        createBtn.onclick = async () => {
                            try {
                                const createResponse = await fetch('/api/setup/create-admin', {
                                    method: 'POST'
                                });
                                const createData = await createResponse.json();
                                if (createResponse.ok) {
                                    alert('Compte admin créé ! Vous pouvez maintenant vous connecter.');
                                    location.reload();
                                } else {
                                    alert('Erreur: ' + createData.error);
                                }
                            } catch (err) {
                                alert('Erreur: ' + err.message);
                            }
                        };
                        if (!document.getElementById('create-admin-btn')) {
                            createBtn.id = 'create-admin-btn';
                            errorDiv.parentElement.appendChild(createBtn);
                        }
                    }
                }
            } catch (error) {
                errorDiv.textContent = 'Erreur de connexion au serveur: ' + error.message;
                errorDiv.style.display = 'block';
            }
        }

        // Vérifier le compte admin au chargement
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('/api/setup/verify-admin');
                const data = await response.json();
                if (!data.exists || !data.passwordValid) {
                    console.log('Compte admin non valide, création nécessaire');
                }
            } catch (error) {
                console.error('Erreur de vérification:', error);
            }
        });
    </script>
</body>
</html>
